[base]
env_name = mcenv

[vec]
total_agents = 2048
num_buffers = 2
num_threads = 8

[env]
max_ticks = 1000
rw_survival = 0.001
rw_block = 20.0
rw_fall = -10.0
rw_speed = 5.0
rw_target_reach = 50.0
curriculum_phase = 0
phase_transition = 3

[policy]
hidden_size = 256
num_layers = 4

[train]
total_timesteps = 10_000_000_000
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.003
minibatch_size = 16384
horizon = 128
ent_coef = 0.01
clip_coef = 0.2
vf_coef = 1.0

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 200
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

# --- Reward weights ---
[sweep.env.rw_block]
distribution = log_normal
min = 1.0
max = 50.0
scale = auto

[sweep.env.rw_fall]
distribution = uniform
min = -100.0
max = -1.0
scale = auto

[sweep.env.rw_speed]
distribution = log_normal
min = 0.1
max = 20.0
scale = auto

[sweep.env.rw_target_reach]
distribution = log_normal
min = 5.0
max = 200.0
scale = auto

[sweep.env.phase_transition]
distribution = uniform
min = 1
max = 20
scale = auto

# --- Policy ---
[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 2
max = 6
scale = auto

# --- Training hyperparams ---
[sweep.train.total_timesteps]
distribution = log_normal
min = 5e8
max = 5e9
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0003
max = 0.03
scale = 0.5

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.99
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 256
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 4096
scale = auto
