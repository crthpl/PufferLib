[base]
env_name = mcenv

[vec]
total_agents = 2048
num_buffers = 2
num_threads = 8

[env]
max_ticks = 1000
rw_survival = 0.001
rw_block = 20.0
rw_fall = -100.0
rw_speed = 5.0
rw_target_reach = 100.0
rw_look_reversal = 0.0
rw_sprint_jump = 0.0
require_ground = 1
fall_scale_phase1 = 1.0
speed_power = 1.0
rot_pct_enabled = 0
place_repeat_enabled = 0
curriculum_phase = 0
phase_transition = 30
force_phase2 = 0

[policy]
hidden_size = 256
num_layers = 4

[train]
total_timesteps = 200_000_000
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.003
minibatch_size = 16384
horizon = 128
ent_coef = 0.02
clip_coef = 0.2
vf_coef = 1.0

[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 100
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

# Reward weights (centered on best known: 20/5/-100/100)
[sweep.env.rw_block]
distribution = log_normal
min = 10.0
max = 40.0
scale = auto

[sweep.env.rw_speed]
distribution = log_normal
min = 2.0
max = 10.0
scale = auto

[sweep.env.rw_target_reach]
distribution = log_normal
min = 50.0
max = 200.0
scale = auto

[sweep.env.rw_fall]
distribution = uniform
min = -200.0
max = -50.0
scale = auto

# Training hparams
[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
max = 0.01
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.005
max = 0.05
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.98
max = 0.999
scale = auto
