[base]
env_name = mcenv

[vec]
total_agents = 2048
num_buffers = 2
num_threads = 8

[env]
max_ticks = 1000
rw_survival = 0.001
rw_block = 5.0
rw_fall = -10.0
rw_speed = 5.0
rw_target_reach = 50.0

[policy]
hidden_size = 256
num_layers = 4

[train]
total_timesteps = 500_000_000
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.003
minibatch_size = 16384
horizon = 128
ent_coef = 0.01
clip_coef = 0.2
vf_coef = 1.0
